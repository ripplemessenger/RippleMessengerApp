plugins {
    id("com.android.application") version "8.9.1" apply false
    id("org.jetbrains.kotlin.android") version "2.0.21" apply false
    id("com.facebook.react.rootproject") version "+" apply true
}

allprojects {
    ext {
        compileSdkVersion = 34
        minSdkVersion = 24
        targetSdkVersion = 34
        ndkVersion = "27.0.12077973"
        supportLibVersion = '1'
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    // RN 0.75 marks some internal APIs (e.g. getJavaScriptContextHolder) with
    // @FrameworkAPI (@RequiresOptIn(ERROR)). vision-camera uses them without
    // opting in, so allow it globally for all Kotlin modules.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-opt-in=com.facebook.react.common.annotations.FrameworkAPI"]
        }
    }
}
